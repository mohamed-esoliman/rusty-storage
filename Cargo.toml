[package]
name = "rusty_storage"
version = "0.1.0"
edition = "2021"
authors = ["Rusty Storage Team"]
description = "A tool to encode files into videos and decode them back"

[dependencies]
ffmpeg-next = { version = "7.1", features = ["codec", "format", "software-resampling"] }
ffmpeg-sys-next = { version = "7.1", features = ["avcodec", "avformat", "swscale"] }
image = "0.24"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
indicatif = "0.17"
colored = "2.1"
tempfile = "3.9"
